<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Sourabh Jain - AI Systems Architect</title>
    <meta
      name="description"
      content="Sourabh Jain is an AI systems architect focused on conversational AI, cloud-native delivery, LLM systems, and practical product engineering."
    />
  </head>
  <body>
    <div id="root"></div>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" style="display: none">
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="project-type">
        <option>Career conversation</option>
        <option>AI architecture discussion</option>
        <option>Conversational AI / bot work</option>
        <option>MVP architecture support</option>
        <option>Speaking / writing / collaboration</option>
        <option>Other</option>
      </select>
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
