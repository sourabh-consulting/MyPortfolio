<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact form</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <p>
        <label>Do not fill this out: <input name="bot-field" /></label>
      </p>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="project-type">
        <option>Career conversation</option>
        <option>AI architecture discussion</option>
        <option>Conversational AI / bot work</option>
        <option>MVP architecture support</option>
        <option>Speaking / writing / collaboration</option>
        <option>Other</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
